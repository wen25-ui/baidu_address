server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/navigation_management_platform?useSSL=false&serverTimezone=UTC
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  redis:
    host: localhost
    port: 6379

baidu:
  ak: your_baidu_map_ak
  api-url: https://api.map.baidu.com

billing:
  commission-rate: 20
  pricing:
    min: 6
    max: 10
    unit: hour

logging:
  level:
    root: INFO
    com.graduation.platform: DEBUG