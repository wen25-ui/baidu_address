server:
  port: 8080

spring:
  application:
    name: parking-share-platform

  datasource:
    url: jdbc:mysql://localhost:3306/graduation_project?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.graduation.platform.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 百度地图配置
baidu:
  map:
    wx-ak: ZmaKnx0vJcB745El7rFTFdqadqxM5JXt
    browser-ak: Ysj2vZPKWz8nwGRiPYD7MBBOvVtQiGlt
    api-url: https://api.map.baidu.com

# JWT配置
jwt:
  secret: ParkingSharePlatformSecretKey2026GraduationProjectVeryLongSecretKey
  expiration: 86400000  # 24小时

# 业务规则配置
parking:
  rules:
    min-duration: 0.5        # 最短预约时长（小时）
    max-duration: 12         # 最长预约时长（小时）
    advance-days: 3          # 最大提前预约天数
    free-cancel-hours: 1     # 免费取消时限（小时）
  credit:
    initial-score: 100       # 初始信用分
    min-score: 60            # 禁止预约阈值
    max-score: 100           # 信用分上限
    timeout-deduct: 5        # 超时未核销扣分
    complete-add: 2          # 按时完成加分
    late-cancel-deduct: 3    # 临时取消扣分

logging:
  level:
    root: INFO
    com.graduation.platform: DEBUG
    com.baomidou.mybatisplus: DEBUG